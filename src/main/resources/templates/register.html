<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Register')}"></head>
<body>
    
    <nav th:replace="~{fragments/common :: navbar}"></nav>

    <div class="auth-container">
        <h2 class="text-center">Create Account</h2>
        <p class="text-center mb-4" style="color: #666;">Join us to find your dream job</p>

        <!-- Alerts -->
        <div th:if="${error}" class="alert alert-danger text-center">
            <span th:text="${error}"></span>
        </div>
        <div th:if="${success}" class="alert alert-success text-center">
            Registration successful! Please login.
        </div>

        <form action="/register" method="post">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input name="username" class="form-control" placeholder="Choose a username" required autofocus>
            </div>
            
            <div class="form-group">
                <label class="form-label">Password</label>
                <input name="password" type="password" class="form-control" placeholder="Create a password" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">I am a</label>
                <select name="role" class="form-control" required>
                    <option value="CANDIDATE" selected>Candidate (Job Seeker)</option>
                    <option value="OFFICER">Officer</option>
                </select>
                <small style="color: #666; display: block; margin-top: 0.5rem;">Select <strong>Candidate</strong> if you are looking for jobs abroad.</small>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
            
            <div class="mt-3 text-center">
                <p>Already have an account? <a href="/login">Login here</a></p>
                <p class="mt-2"><a href="/" style="font-size: 0.9rem;">Back to Home</a></p>
            </div>
        </form>
    </div>

    <footer th:replace="~{fragments/common :: footer}"></footer>

</body>
</html>
