<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Login')}"></head>
<body>
    
    <nav th:replace="~{fragments/common :: navbar}"></nav>

    <div class="auth-container">
        <h2 class="text-center">Welcome Back</h2>
        <p class="text-center mb-4" style="color: #666;">Please login to your account</p>

        <!-- Alerts -->
        <div th:if="${param.error}" class="alert alert-danger text-center">
            Invalid username or password
        </div>
        <div th:if="${param.logout}" class="alert alert-success text-center">
            You have been logged out successfully
        </div>
        <div th:if="${success}" class="alert alert-success text-center" th:text="${success}">
            Registration successful! Please login.
        </div>

        <form action="/login" method="post">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input name="username" class="form-control" placeholder="Enter your username" required autofocus>
            </div>
            
            <div class="form-group">
                <label class="form-label">Password</label>
                <input name="password" type="password" class="form-control" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            
            <div class="mt-3 text-center">
                <p>Don't have an account? <a href="/register">Register here</a></p>
                <p class="mt-2"><a href="/" style="font-size: 0.9rem;">Back to Home</a></p>
            </div>
        </form>
    </div>

    <footer th:replace="~{fragments/common :: footer}"></footer>

</body>
</html>
