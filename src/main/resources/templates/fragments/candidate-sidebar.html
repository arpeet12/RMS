<aside class="sidebar" th:fragment="sidebar(activePage)">
    <div class="text-center mb-4">
        <div style="width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 1rem; overflow: hidden; box-shadow: var(--shadow); background: #f0f0f0;">
            <img th:if="${candidate != null && candidate.profilePhotoPath != null}" th:src="@{${candidate.profilePhotoPath}}"
                 alt="Profile Photo" style="width: 100%; height: 100%; object-fit: cover;">
            <div th:unless="${candidate != null && candidate.profilePhotoPath != null}" 
                 style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #aaa;">
                <i class="fas fa-user" style="font-size: 2rem;"></i>
            </div>
        </div>
        <h4 th:text="${candidate != null ? candidate.fullName : #authentication.name}">User Name</h4>
        <p class="text-muted" style="font-size: 0.9rem;">Candidate</p>
        <form th:action="@{/candidate/profile/photo}" method="post" enctype="multipart/form-data" style="margin-top: 0.5rem;">
            <input type="file" name="photo" accept="image/*" style="width: 100%; margin-bottom: 0.5rem;">
            <button type="submit" class="btn btn-secondary" style="width: 100%;">Change Photo</button>
        </form>
    </div>
    
    <ul class="sidebar-menu">
        <li class="sidebar-item">
            <a href="/dashboard" class="sidebar-link" th:classappend="${activePage == 'dashboard'} ? 'active'">
                <i class="fas fa-tachometer-alt" style="width: 25px;"></i> Dashboard
            </a>
        </li>
        <li class="sidebar-item">
            <a href="/candidate/profile" class="sidebar-link" th:classappend="${activePage == 'profile'} ? 'active'">
                <i class="fas fa-user-circle" style="width: 25px;"></i> My Profile
            </a>
        </li>
        <li class="sidebar-item">
            <a href="/candidate/jobs" class="sidebar-link" th:classappend="${activePage == 'jobs'} ? 'active'">
                <i class="fas fa-briefcase" style="width: 25px;"></i> Applied Jobs
            </a>
        </li>
        <li class="sidebar-item">
            <a href="/candidate/documents" class="sidebar-link" th:classappend="${activePage == 'documents'} ? 'active'">
                <i class="fas fa-file-alt" style="width: 25px;"></i> Documents
            </a>
        </li>
        <li class="sidebar-item">
            <a href="/candidate/settings" class="sidebar-link" th:classappend="${activePage == 'settings'} ? 'active'">
                <i class="fas fa-cog" style="width: 25px;"></i> Settings
            </a>
        </li>
    </ul>
</aside>
