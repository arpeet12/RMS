<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Admin Dashboard')}"></head>
<body>

    <!-- Navbar -->
    <nav th:replace="~{fragments/common :: navbar}"></nav>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="text-center mb-4">
                <div style="width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 1rem; overflow: hidden; box-shadow: var(--shadow); background: #f0f0f0;">
                    <img th:if="${user != null && user.profilePhotoPath != null}" th:src="@{${user.profilePhotoPath}}"
                         alt="Admin Photo" style="width: 100%; height: 100%; object-fit: cover;">
                    <div th:unless="${user != null && user.profilePhotoPath != null}" 
                         style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #aaa;">
                        <i class="fas fa-user-shield" style="font-size: 2rem;"></i>
                    </div>
                </div>
                <h4 th:text="${#authentication.name}">Admin</h4>
                <p class="text-muted" style="font-size: 0.9rem;">Administrator</p>
                <form th:action="@{/admin/profile/photo}" method="post" enctype="multipart/form-data" style="margin-top: 0.5rem;">
                    <input type="file" name="photo" accept="image/*" style="width: 100%; margin-bottom: 0.5rem;">
                    <button type="submit" class="btn btn-secondary" style="width: 100%;">Change Photo</button>
                </form>
            </div>
            
            <ul class="sidebar-menu">
                <li class="sidebar-item">
                    <a href="/admin/dashboard" class="sidebar-link active">
                        <i class="fas fa-tachometer-alt" style="width: 25px;"></i> Dashboard
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="/admin/candidates" class="sidebar-link">
                        <i class="fas fa-users" style="width: 25px;"></i> Manage Candidates
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="/admin/jobs" class="sidebar-link">
                        <i class="fas fa-briefcase" style="width: 25px;"></i> Manage Jobs
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="#" class="sidebar-link">
                        <i class="fas fa-chart-bar" style="width: 25px;"></i> Reports
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="#" class="sidebar-link">
                        <i class="fas fa-cog" style="width: 25px;"></i> Settings
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-content">
            <div class="welcome-section mb-4">
                <h2>Admin Dashboard</h2>
                <p class="text-muted">Manage your recruitment process efficiently.</p>
            </div>

            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div style="background: rgba(0, 51, 102, 0.1); padding: 1rem; border-radius: 50%;">
                        <i class="fas fa-users" style="font-size: 1.5rem; color: var(--primary-color);"></i>
                    </div>
                    <div>
                        <div class="stat-value">150+</div>
                        <div class="stat-label">Total Candidates</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div style="background: rgba(40, 167, 69, 0.1); padding: 1rem; border-radius: 50%;">
                        <i class="fas fa-briefcase" style="font-size: 1.5rem; color: var(--success);"></i>
                    </div>
                    <div>
                        <div class="stat-value">12</div>
                        <div class="stat-label">Active Jobs</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div style="background: rgba(253, 184, 19, 0.1); padding: 1rem; border-radius: 50%;">
                        <i class="fas fa-plane-departure" style="font-size: 1.5rem; color: var(--accent-color);"></i>
                    </div>
                    <div>
                        <div class="stat-value">45</div>
                        <div class="stat-label">Visas Processed</div>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="mt-5">
                <h3 class="mb-3">Quick Actions</h3>
                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <a href="/admin/candidates/add" class="btn btn-primary">
                        <i class="fas fa-user-plus"></i> Add New Candidate
                    </a>
                    <a href="/admin/jobs/add" class="btn btn-secondary">
                        <i class="fas fa-plus-circle"></i> Post New Job
                    </a>
                </div>
            </div>

        </main>
    </div>

</body>
</html>
